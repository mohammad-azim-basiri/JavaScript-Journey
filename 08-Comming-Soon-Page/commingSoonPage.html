<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>commingSoonPage</title>
    <link rel="stylesheet" href="commingSoonPage.css">
</head>
<body>
    <div class="container">
        <img src="logo.png" alt="logo" class="logo">

        <div class="content">
            <p>We Are Coming, Sooner Than You Think.</p>
            <h1>We Are <span>Launching</span> Soon.</h1>
            <div class="launch-time">
                <div><p id="days">00</p><span>Days</span></div>
                <div><p id="hours">00</p><span>Hous</span></div>
                <div><p id="minutes">00</p><span>Minutes</span></div>
                <div><p id="seconds">00</p><span>Seconds</span></div>
            </div>
            <button type="button">Learn More <img src="triangle.png" alt="triangle"></button>
        </div>
        <img src="rocket.png" alt="rocket" class="rocket">
    </div>
    <script src="commingSoonPage.js"></script>
</body>
</html>
