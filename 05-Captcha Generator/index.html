<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captcha Generator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/ce512e2f8f.js"></script>
</head>
<body>
    <div class="container">
        <header>Captcha Generator</header>
        <div class="input_field captcha_box">
            <input type="text" value="" disabled>
            <button class="refresh_button">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>
        <div class="input_field captcha_input">
            <input type="text" placeholder="Enter Captcha">
        </div>
        <div class="message"></div>
        <div class="input_field button disabled">
            <button>Submit Captcha</button>
        </div>
    </div>






    <script src="script.js"></script>
</body>
</html>
