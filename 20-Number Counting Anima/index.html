<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Counting Animated</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <i class='bx bx-package'></i>
            <span class="num" data-val="400">000</span>
            <span class="text">Box Sended</span>
        </div>
        <div class="container">
            <i class='bx bx-happy'></i>
            <span class="num" data-val="340">000</span>
            <span class="text">Happy Customers</span>
        </div>
        <div class="container">
            <i class='bx bxs-user'></i>
            <span class="num" data-val="230">000</span>
            <span class="text">Worker</span>
        </div>
        <div class="container">
            <i class='bx bxs-star'></i>
            <span class="num" data-val="150">000</span>
            <span class="text">Five Stars</span>
        </div>
    </div>



    <script src="script.js"></script>
</body>
</html>
